spring.application.name=shuttle-tracker-backend
server.port=8080

# --- Database layer (see ../database) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shuttle}
spring.datasource.username=${DB_USER:shuttle}
spring.datasource.password=${DB_PASSWORD:shuttle}
# Schema is owned by database/init/*.sql; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Tracking layer (see ../traccar) ---
# A Traccar user account; create it in the Traccar web UI (http://localhost:8082) on first start.
traccar.base-url=${TRACCAR_URL:http://localhost:8082}
traccar.email=${TRACCAR_EMAIL:admin@shuttle.local}
traccar.password=${TRACCAR_PASSWORD:admin}
traccar.reconnect-seconds=10

# --- Live feed to the dashboard (ws://localhost:8080/ws/fleet) ---
# Origins of the frontend allowed to open the WebSocket (see ../frontend/Properties/launchSettings.json).
live-feed.allowed-origins=${LIVE_FEED_ORIGINS:http://localhost:5020,https://localhost:7020}

management.endpoints.web.exposure.include=health
